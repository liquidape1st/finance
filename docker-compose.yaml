services:
  redis:
    image: redis:latest
    container_name: finance_redis
    ports:
      - "6379:6379"
    networks:
      - microservices-net
    volumes:
      - finance_redis_data:/data
    command: redis-server --appendonly yes --requirepass "eYXX7EwVmmxKDCDmwMtyKVge8oLd2t86"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: finance_mysql
    command: --max_allowed_packet=1024000000
    environment:
      # Giữ lại ROOT password và tên database. ROOT có thể cần để chạy file init
      MYSQL_ROOT_PASSWORD: ComplexPa$$w0rd123@
      MYSQL_DATABASE: finance
      # Xóa: MYSQL_USER, MYSQL_PASSWORD, MYSQL_USER_HOST
      MYSQL_ROOT_HOST: "%"
      TZ: "Asia/Ho_Chi_Minh"
    ports:
      - "3306:3306"
    networks:
      - microservices-net
    volumes:
      # Thêm: Mount thư mục khởi tạo SQL
      - ./resource/mysql_init:/docker-entrypoint-initdb.d
      - finance_mysql_data:/var/lib/mysql
    healthcheck:
      # Sử dụng tài khoản root cho healthcheck (hoặc tài khoản liquidape nếu bạn chắc chắn nó đã được tạo)
      test: mysqladmin ping -h 127.0.0.1 -u root --password=$$MYSQL_ROOT_PASSWORD
      interval: 1s
      timeout: 20s
      retries: 10
      start_period: 10s

  # redisinsight:
  #   image: redis/redisinsight:latest
  #   restart: unless-stopped
  #   container_name: finance_redisinsight
  #   ports:
  #     - "5540:5540"
  #   volumes:
  #     - finance_redis_insight:/data
  #   environment:
  #     - REDIS_HOSTS=redis://:eYXX7EwVmmxKDCDmwMtyKVge8oLd2t86@redis:6379
  #   networks:
  #     - microservices-net
  #   depends_on:
  #     - redis

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fi_server
    profiles:
      - prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8886:8886"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - microservices-net
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -s http://localhost:8886/actuator/health || exit 1" ]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  client:
    container_name: fi_client
    build:
      context: ./client
      dockerfile: Dockerfile
    profiles:
      - prod
    ports:
      - 6866:6866
    environment:
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      server:
        condition: service_healthy
    networks:
      - microservices-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

  dashboard:
    container_name: fi_dashboard
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "8268:8268"
    environment:
      TZ: Asia/Ho_Chi_Minh
    profiles:
      - prod
    depends_on:
      server:
        condition: service_healthy
    networks:
      - microservices-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

  n8n:
    container_name: n8n
    build:
      context: .
      dockerfile: assistant/n8n/Dockerfile
    profiles:
      - prod
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - WEBHOOK_URL=https://n8n.goincome.net/

      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=someRandomTokenForAuthCRTqwe123@#$
      - N8N_NATIVE_PYTHON_RUNNER=true
    restart: unless-stopped
    networks:
      - microservices-net

  playwright-api:
    container_name: playwright-api
    build:
      context: ./playwright-api
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - microservices-net
    # Khuyến nghị: chỉ dùng nội bộ, không cần mở port ra Internet
    # Nếu bạn cần test từ host thì mở port:
    ports:
      - "8000:8000"

  task-runners:
    container_name: n8n-runners
    build:
      context: ./assistant/n8n-task-runners
      dockerfile: Dockerfile
    profiles:
      - prod
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=someRandomTokenForAuthCRTqwe123@#$
      - N8N_RUNNERS_CONFIG_FILE=/etc/n8n-task-runners.json
    depends_on:
      - n8n
    networks:
      - microservices-net
    volumes:
      - ./assistant/n8n-task-runners/n8n-task-runners.json:/etc/n8n-task-runners.json
    restart: unless-stopped

  nginx:
    container_name: ms_nginx
    image: nginx:latest
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - 80:80
    depends_on:
      - client
      - dashboard
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - microservices-net

networks:
  microservices-net:
    external: true

volumes:
  finance_mysql_data:
  finance_redis_data:
  finance_redis_insight:
  n8n_data:
