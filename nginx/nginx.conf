upstream finance_client_upstream {
    server client:6866;
}

upstream finance_dashboard_upstream {
    server dashboard:8268;
}
upstream finance_server_upstream {
    server server:8886;
}

server {
    listen 80;
    server_name huongtramhaiyen.com www.huongtramhaiyen.com;
    client_max_body_size 400M;

    # Backend API
    location /api/ {
        proxy_pass http://incense_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 86400;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Frontend
    location / {
        proxy_pass http://incense_client_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

