upstream finance_client_upstream {
    server client:6866;
}

upstream finance_dashboard_upstream {
    server dashboard:8268;
}
upstream finance_server_upstream {
    server server:8886;
}

server {
    listen 80;
    server_name goincome.net www.goincome.net;
    client_max_body_size 400M;

    location / {
        proxy_pass http://finance_client_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name portal.goincome.net;
    client_max_body_size 400M;

    location / {
        proxy_pass http://finance_dashboard_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name api.goincome.net;
    client_max_body_size 400M;

    location /api/ {
        proxy_pass http://finance_server_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}